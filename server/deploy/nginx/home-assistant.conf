server {
    listen 80;
    listen [::]:80;
    server_name ha.black-castle.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public :443 is nginx stream ssl_preread → 127.0.0.1:8443 (same as grafana/elion).
# Do not listen on 0.0.0.0:443 here: SNI would miss this vhost and serve elion cert.
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name ha.black-castle.ru;

    ssl_certificate     /etc/letsencrypt/live/ha.black-castle.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ha.black-castle.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
